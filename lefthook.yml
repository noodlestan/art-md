assert_lefthook_installed: true

pre-commit:
  follow: true
  parallel: false
  commands:
    '0-clean':
      run: npm run clean
    '0-build-deps':
      run: npx turbo run build --filter=@noodlestan/purrfiles-extract --filter=@noodlestan/purrfiles-entities
    '1-extract':
      run: npm run extract
    '2-ci':
      run: npm run ci
